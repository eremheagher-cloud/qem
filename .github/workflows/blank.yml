name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Instance Number (1-10)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-11-arm
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $instance = '${{ inputs.instance_number }}'

          if ($instance -notmatch '^(?:[1-9]|10)$') {
            throw 'Instance number must be between 1 and 10.'
          }

          Write-Host "Starting instance $instance"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:TEMP 'tailscale-setup.exe'
          $tailscale = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          if (-not (Test-Path $tailscale)) {
            Invoke-WebRequest `
              -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' `
              -OutFile $installer

            $process = Start-Process `
              -FilePath $installer `
              -ArgumentList '/quiet' `
              -Wait `
              -PassThru

            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed: $($process.ExitCode)"
            }
          }

          if (-not (Test-Path $tailscale)) {
            throw 'Tailscale executable not found.'
          }

          Write-Host 'Tailscale installation completed.'

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Configure TAILSCALE_AUTH_KEY in GitHub Actions Secrets.'
          }

          $tailscale = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          $service = Get-Service -Name 'Tailscale' -ErrorAction Stop

          if ($service.Status -ne 'Running') {
            Start-Service -Name 'Tailscale'
          }

          $deadline = (Get-Date).AddMinutes(3)
          $connected = $false
          $ip = $null

          while ((Get-Date) -lt $deadline) {
            $service = Get-Service -Name 'Tailscale'

            if ($service.Status -ne 'Running') {
              Write-Host 'Waiting for Tailscale service...'
              Start-Sleep -Seconds 5
              continue
            }

            Write-Host 'Attempting Tailscale connection...'

            $outputFile = Join-Path $env:TEMP 'tailscale-up-output.txt'
            $errorFile = Join-Path $env:TEMP 'tailscale-up-error.txt'

            Remove-Item $outputFile, $errorFile `
              -Force -ErrorAction SilentlyContinue

            $process = Start-Process `
              -FilePath $tailscale `
              -ArgumentList @(
                'up',
                "--auth-key=$env:TAILSCALE_AUTH_KEY",
                "--hostname=github-pc-${{ inputs.instance_number }}"
              ) `
              -Wait `
              -PassThru `
              -NoNewWindow `
              -RedirectStandardOutput $outputFile `
              -RedirectStandardError $errorFile

            if (Test-Path $outputFile) {
              Get-Content $outputFile
            }

            if (Test-Path $errorFile) {
              Get-Content $errorFile
            }

            if ($process.ExitCode -eq 0) {
              $statusOutput = & $tailscale status --json 2>&1
              $statusCode = $LASTEXITCODE

              if ($statusCode -eq 0) {
                try {
                  $status = ($statusOutput -join "`n") |
                    ConvertFrom-Json -ErrorAction Stop

                  if ($status.BackendState -eq 'Running') {
                    $ipOutput = & $tailscale ip -4 2>&1

                    if ($LASTEXITCODE -eq 0 -and $ipOutput) {
                      $candidate = (
                        $ipOutput | Select-Object -First 1
                      ).ToString().Trim()

                      if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') {
                        $ip = $candidate
                        $connected = $true
                        break
                      }
                    }
                  }
                  else {
                    Write-Host "Backend state: $($status.BackendState)"
                  }
                }
                catch {
                  Write-Host 'Tailscale status is not ready yet.'
                }
              }
            }
            else {
              Write-Host "Tailscale command exited with code $($process.ExitCode)."
            }

            Write-Host 'Retrying in 10 seconds...'
            Start-Sleep -Seconds 10
          }

          if (-not $connected) {
            $ErrorActionPreference = 'Continue'
            & $tailscale status
            $ErrorActionPreference = 'Stop'

            throw 'Tailscale failed to connect within 3 minutes. Check the authentication key and the preceding error output.'
          }

          "TAILSCALE_IP=$ip" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 -Append

          Write-Host "Tailscale connected. IPv4: $ip"

      - name: Configure Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue

          Set-Service -Name 'TermService' -StartupType Automatic

          $rdpService = Get-Service -Name 'TermService'

          if ($rdpService.Status -ne 'Running') {
            Start-Service -Name 'TermService'
          }

          Write-Host 'Remote Desktop configuration completed.'

      - name: Create Rafael Account
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Username = 'Rafael'
          $Password = 'Wl7mX#2026@Pc!'

          $SecurePassword = ConvertTo-SecureString `
            $Password -AsPlainText -Force

          $User = Get-LocalUser -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -eq $User) {
            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -Description 'Windows account Rafael' `
              -ErrorAction Stop | Out-Null
          }
          else {
            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -ErrorAction Stop
          }

          Enable-LocalUser -Name $Username

          $group = Get-LocalGroup -Name 'Remote Desktop Users' `
            -ErrorAction Stop

          $membership = Get-LocalGroupMember `
            -Group $group `
            -ErrorAction SilentlyContinue

          $alreadyMember = $membership | Where-Object {
            $_.Name -like "*\$Username" -or $_.Name -eq $Username
          }

          if (-not $alreadyMember) {
            Add-LocalGroupMember `
              -Group $group `
              -Member $Username
          }

          Write-Host 'Windows account configured.'

      - name: Test RDP and Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_IP)) {
            throw 'TAILSCALE_IP is missing.'
          }

          $ip = $env:TAILSCALE_IP
          $rdpReady = $false

          for ($i = 1; $i -le 12; $i++) {
            $listener = Get-NetTCPConnection `
              -State Listen `
              -LocalPort 3389 `
              -ErrorAction SilentlyContinue

            if ($listener) {
              $rdpReady = $true
              break
            }

            Write-Host "Waiting for RDP listener ($i/12)..."
            Start-Sleep -Seconds 5
          }

          if ($rdpReady) {
            Write-Host 'RDP port 3389 is listening.'
          }
          else {
            Write-Warning 'RDP port 3389 is not listening.'
          }

          Write-Host "Tailscale IPv4: $ip"
          Write-Host 'Network checks completed.'

      - name: Show Connection Details
        if: ${{ success() }}
        shell: pwsh
        run: |
          Write-Host ''
          Write-Host '======= VIRTUAL PC DETAILS ======='
          Write-Host 'Windows account: Rafael'
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host 'RDP port: 3389'
          Write-Host 'Password is configured in Create Rafael Account.'
          Write-Host '=================================='

      - name: Keep Runner Active
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $endTime = (Get-Date).AddHours(5)

          while ((Get-Date) -lt $endTime) {
            Write-Host "Runner active: $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }

          Write-Host 'Wait period completed.'
